name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck + Build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 先 build 后 typecheck：包间类型经 node_modules → dist/*.d.ts 解析，
      # 干净检出下 dist 不存在，typecheck 必须在产物生成后运行
      - name: Build (generates d.ts)
        run: pnpm run build

      - name: Typecheck
        run: pnpm -r typecheck

  smoke:
    name: Playwright smoke (playgrounds render)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 预构建 playground 后用 vite preview 冒烟：
      # 静态服务消灭 dev 依赖预构建竞态（CI 冷缓存 500/504 根因）
      - name: Build playgrounds
        run: pnpm --filter playground build && pnpm --filter playground-react build

      - name: Run smoke (preview mode)
        run: node scripts/smoke.mjs --preview
