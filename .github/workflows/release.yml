name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    name: Version & Publish (changesets)
    runs-on: ubuntu-latest
    # changesets 发布后推 git tag / 开 Version PR 需要 contents 写权限
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets 需要 full history 生成 GitHub 关联 changelog
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry: https://registry.npmjs.org/

      - name: Install
        run: pnpm install --frozen-lockfile

      # 发布打包的是 dist：先全量构建（拓扑序）
      - name: Build
        run: pnpm run build

      - name: Create release or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # 有待发 changeset → 开 Version PR；合入后无待发 changeset → 发布
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "published: ${{ steps.changesets.outputs.published }}"
          echo "pull_request: ${{ steps.changesets.outputs.pullRequestNumber }}"
